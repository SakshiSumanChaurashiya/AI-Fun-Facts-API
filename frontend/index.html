<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fun Facts API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Fun Facts</h1>
        <p class="subtitle">
            Discover interesting facts using AI
        </p>
        <div class="card">
            <label for="topic">
                Enter a topic
            </label>
            <input 
                type="text"
                id="topic"
                placeholder="Example: Space, Animals, Science..."
            >
            <button id="generateBtn">
                generate Fun Fact
            </button>
            <div id="loading"
            class="loading">
            generating fun fact...
        </div>
        <div id="result" class="result">
            Your fun fact will appear here.
        </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
